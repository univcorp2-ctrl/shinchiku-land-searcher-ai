[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinchiku-land-searcher"
version = "0.1.0"
description = "CLI assistant for property request preparation and investment ranking analysis from Excel."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shinchiku Land Searcher" }]
dependencies = [
  "openpyxl>=3.1.2",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.3"
]

[project.optional-dependencies]
ai = ["openai>=1.40.0", "anthropic>=0.34.0"]
browser = ["playwright>=1.44.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[project.scripts]
shinchiku-land-searcher = "shinchiku_land_searcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
